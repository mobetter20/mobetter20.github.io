<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ajin.im</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/entrances/cabinet.css?v=2026-11-07b">
<meta name="description" content="Running, writing, and building. A personal index by Ajin.">
<link rel="canonical" href="https://ajin.im/">
<meta property="og:title" content="ajin.im">
<meta property="og:description" content="Running, writing, and building.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ajin.im/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="/img/a1.png">
<link rel="apple-touch-icon" href="/img/a1.png">
<link rel="alternate" type="application/atom+xml" title="ajin.im writes" href="/writes/feed.xml">
<script src="/analytics.js" defer>
</script>
</head>
<body class="machine-c" data-finish="blue">
<main class="machine">
<div class="top-cap" aria-hidden="true">
</div>
<header class="marquee">
<h1 class="site-heading"><a href="/" target="_self" class="brand" aria-label="ajin.im home">ajin.im</a></h1>
<div class="marquee-note">SELF-SERVICE<br>INDEX</div>
</header>
<div class="machine-body">
<div class="selection-bay">
<section class="inventory" id="worlds" aria-label="Worlds">{{home_worlds}}</section>
<section class="inventory" id="building" aria-label="Builds">{{home_building}}</section>
<section class="inventory" id="writing" aria-label="Writing">{{home_essays}}</section>
<a class="run-line" id="running" href="/is/running/" target="_blank" rel="noopener">
<span class="run-copy"><span>Running since {{running_since}}</span><span>{{running_as_of}}</span></span>
<strong>{{running_total_km}} km <span aria-hidden="true">↗</span></strong>
</a>
</div>
</div>
<footer class="service-panel">
<a class="contact-port" href="mailto:contact@ajin.im">
<span class="port-label">CONTACT</span>
<span class="port-paper">contact@ajin.im <span>↗</span>
</span>
</a>
<div class="service-mark">
<span>ajin.im</span>
<small>PERSONAL SITE</small>
</div>
</footer>
<div class="base" aria-hidden="true">
</div>
</main>
<script src="/assets/entrances/cabinet.js">
</script>
</body>
</html>
