name: Rebuild root pages when stats.md changes

on:
  push:
    branches: [master]
    paths:
      - "content/stats.md"
      - "templates/root.html"
      - "templates/running.html"
      - "_scripts/build_root.py"
      - "_scripts/home_catalog.py"
      - "_scripts/build_essays.py"
      - "_scripts/build_writes.py"
      - "_scripts/test_build_root.py"
      - ".github/workflows/rebuild-root-on-stats.yml"
      - "is/writing/essays/_src/**"
      - "is/building/index.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild index + running pages
        run: |
          python3 _scripts/build_root.py
          python3 _scripts/build_root.py --check-home
          python3 -m unittest discover -s _scripts -p test_build_root.py

      - name: Rebuild sitemap
        run: python3 _scripts/build_sitemap.py

      - name: Check for changes
        id: changes
        run: |
          git add index.html is/running/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rebuilt pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild root pages from stats.md"

      - name: Push rebuilt pages
        if: steps.changes.outputs.changed == 'true'
        run: git push

      # GITHUB_TOKEN commits do not trigger a legacy Pages build themselves.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
